---
- name: removetask
  hosts: dbserver
  tasks:
  - name: uninstall nginx
    apt:
     name: nginx
     state: absent
  - name: delete user
    user:
     name: u123
     state: absent
  - name: uninstall php
    apt:
     name: php
     state: absent   	
    register: output
  - name: debug
    debug:
     var: output
